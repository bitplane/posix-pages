name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install AWK implementations
        run: sudo apt-get update && sudo apt-get install -y busybox gawk

      - name: Fetch release tools
        run: make tools

      - name: Run tests
        run: make test-tools

      - name: Build release asset
        run: |
          mkdir -p build
          cp bin/posix-pages build/posix-pages
          chmod +x build/posix-pages
          sha256sum build/posix-pages > build/posix-pages.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              --clobber \
              build/posix-pages#posix-pages \
              build/posix-pages.sha256#posix-pages.sha256
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes \
              build/posix-pages#posix-pages \
              build/posix-pages.sha256#posix-pages.sha256
          fi
